<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>무전기</title>
<style>
:root {
  --bg: #101317; --panel: #1a1f26; --line: #2a313b;
  --text: #e8ecf1; --dim: #8a94a3;
  --tx: #e5484d; --rx: #30a46c; --req: #b7791f; --dnd: #f5a524; --off: #4b525c;
}
* { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; overflow: hidden; }
body { display: grid; grid-template-columns: 1fr minmax(300px, 38%); grid-template-rows: auto 1fr;
  gap: 16px; padding: 16px; }
header { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { padding: 7px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  font-size: 15px; display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); }
.dot.ok { background: var(--rx); } .dot.warn { background: var(--dnd); } .dot.bad { background: var(--tx); }
.spacer { flex: 1; }

#video { background: #000; border-radius: 14px; border: 1px solid var(--line); display: flex;
  align-items: center; justify-content: center; color: var(--dim); font-size: 17px; text-align: center;
  padding: 16px; min-height: 0; }

aside { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
#ptt { flex: 1; min-height: 160px; border-radius: 24px; border: none; background: #262d36; color: #fff;
  font-size: 30px; font-weight: 700; touch-action: none; transition: background .12s; line-height: 1.3; }
#ptt small { display: block; font-size: 16px; font-weight: 500; opacity: .8; margin-top: 6px; }
#ptt.tx { background: var(--tx); } #ptt.rx { background: var(--rx); } #ptt.req { background: var(--req); }
#ptt.blocked { background: #1d2127; color: var(--dim); }
.toggles { display: flex; gap: 12px; }
.tg { flex: 1; padding: 18px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel);
  color: var(--text); font-size: 18px; font-weight: 600; }
.tg.on { border-color: var(--dnd); color: var(--dnd); }
#cam.on { border-color: var(--rx); color: var(--rx); }
#notice { min-height: 26px; text-align: center; color: var(--dnd); font-size: 17px; opacity: 0; transition: opacity .2s; }
#notice.show { opacity: 1; }

@media (orientation: portrait) {
  body { grid-template-columns: 1fr; grid-template-rows: auto minmax(160px, 40%) 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="pill"><span class="dot" id="connDot"></span><span id="me">연결 중…</span></div>
  <div class="pill"><span class="dot" id="peerDot"></span><span id="peer">상대 —</span></div>
  <div class="spacer"></div>
  <div class="pill" id="myCam" style="display:none">● 내 카메라 공유 중</div>
</header>

<section id="video">상대 카메라 영상 자리입니다<br>(영상은 다음 단계에서 붙입니다)</section>

<aside>
  <button id="ptt" class="blocked">누르고 말하기</button>
  <div id="notice"></div>
  <div class="toggles">
    <button class="tg" id="cam">카메라 공유</button>
    <button class="tg" id="dnd">방해금지</button>
  </div>
</aside>

<script>
var $ = function (id) { return document.getElementById(id); };
var ws = null, st = null, holding = false, lastNotice = null, noticeTimer = null;

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = function (e) { st = JSON.parse(e.data); render(); };
  ws.onclose = function () {
    st = null; holding = false; render();
    setTimeout(connect, 1000);
  };
}
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function down() { if (holding) return; holding = true; send({ t: "ptt", down: true }); }
function up() { if (!holding) return; holding = false; send({ t: "ptt", down: false }); }

var ptt = $("ptt");
ptt.addEventListener("pointerdown", function (e) {
  e.preventDefault();
  try { ptt.setPointerCapture(e.pointerId); } catch (err) {}
  down();
});
["pointerup", "pointercancel", "lostpointercapture"].forEach(function (ev) { ptt.addEventListener(ev, up); });
document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
document.addEventListener("keydown", function (e) {
  if (e.code === "Space" && !e.repeat) { e.preventDefault(); down(); }
});
document.addEventListener("keyup", function (e) { if (e.code === "Space") { e.preventDefault(); up(); } });
window.addEventListener("blur", up);
document.addEventListener("visibilitychange", function () { if (document.hidden) up(); });

$("dnd").addEventListener("click", function () { if (st) send({ t: "dnd", on: !st.dnd }); });
$("cam").addEventListener("click", function () { if (st) send({ t: "camera", on: !st.camera }); });

function render() {
  if (!st) {
    $("me").textContent = "노드와 연결 끊김 — 다시 연결 중";
    $("connDot").className = "dot bad";
    ptt.className = "blocked"; ptt.innerHTML = "연결 중…";
    return;
  }
  var p = st.peer;
  $("me").textContent = st.name + (st.parrot ? " (앵무새)" : "");
  $("connDot").className = "dot " + (!st.audio ? "bad" : st.dnd ? "warn" : "ok");
  if (!st.audio) $("me").textContent += " · 마이크/스피커 없음";

  var peerText = "상대 " + p.name + " · ";
  if (!p.online) { peerText += "연결 안 됨"; $("peerDot").className = "dot bad"; }
  else if (p.dnd) { peerText += "방해금지"; $("peerDot").className = "dot warn"; }
  else if (!p.audio) { peerText += "오디오 장치 문제"; $("peerDot").className = "dot bad"; }
  else { peerText += "연결됨" + (p.camera ? " · 카메라 공유 중" : ""); $("peerDot").className = "dot ok"; }
  $("peer").textContent = peerText;

  var cls, label, sub = "";
  if (st.mode === "tx") { cls = "tx"; label = "송신 중"; sub = "떼면 넘어갑니다"; }
  else if (st.mode === "rx") { cls = "rx"; label = "수신 중"; sub = p.name + " 님이 말하는 중"; }
  else if (st.mode === "requesting") { cls = "req"; label = "연결 중…"; }
  else if (st.dnd) { cls = "blocked"; label = "방해금지 중"; sub = "끄면 다시 주고받습니다"; }
  else if (!st.audio) { cls = "blocked"; label = "마이크/스피커 없음"; sub = "USB 를 확인하십시오 · 자동으로 다시 연결합니다"; }
  else if (!p.online) { cls = "blocked"; label = "상대 연결 안 됨"; }
  else if (p.dnd) { cls = "blocked"; label = "상대 방해금지"; }
  else { cls = ""; label = "누르고 말하기"; sub = "누르는 동안 송신 · 스페이스바도 됩니다"; }
  ptt.className = cls;
  ptt.innerHTML = label + (sub ? "<small>" + sub + "</small>" : "");

  $("dnd").className = "tg" + (st.dnd ? " on" : "");
  $("dnd").textContent = st.dnd ? "방해금지 켜짐" : "방해금지";
  $("cam").className = "tg" + (st.camera ? " on" : "");
  $("cam").textContent = st.camera ? "카메라 공유 중" : "카메라 공유";
  $("myCam").style.display = st.camera ? "" : "none";

  if (lastNotice === null) lastNotice = st.notice_id;        // 접속 직후 옛 알림은 띄우지 않는다
  if (st.notice_id !== lastNotice) {
    lastNotice = st.notice_id;
    $("notice").textContent = st.notice;
    $("notice").className = "show";
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { $("notice").className = ""; }, 3000);
  }
}

connect();
</script>
</body>
</html>
